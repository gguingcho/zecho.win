<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zecho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Comfortaa:wght@500;700&display=swap">
<style>
/* 레이아웃: 파스텔 하늘 위에 떠 있는 '브라우저 창' 두 개
   ① my page 창 — 주소창 + 왼쪽 프사·링크 버튼 / 오른쪽 인사→(프사 클릭)→자기소개
   ② my chats 창 — 캐챗 카드
   여러 톤의 핑크를 섞어서 씀 */
:root {
  color-scheme: light;
  --cream: #fff7f9;       /* 창 안쪽 바탕 */
  --blush: #ffe4ec;       /* 아주 연한 핑크 */
  --peach: #ffc9cf;       /* 피치 핑크 */
  --lilac: #f6cfe8;       /* 라일락 핑크 */
  --rose: #ff8fb1;        /* 로즈 핑크 */
  --hot: #f45b8f;         /* 진한 핫핑크 (포인트) */
  --berry: #b8466f;       /* 베리 (글자 강조) */
  --ink: #8d5b6e;         /* 본문 글자 */
  --white: #ffffff;

  --font-ko: "Gowun Dodum", "Noto Sans CJK KR", "Apple SD Gothic Neo", sans-serif;
  --font-en: "Comfortaa", "Gowun Dodum", "Noto Sans CJK KR", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  /* 핑크 → 라일락 → 피치로 번지는 하늘 + 흰 별가루 */
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.9) 1.5px, transparent 2px) 0 0 / 46px 46px,
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.7) 1px, transparent 1.5px) 0 0 / 30px 30px,
    linear-gradient(170deg, #ffd6e4 0%, #f8d6f0 45%, #ffe1d9 100%);
  color: var(--ink);
  font-family: var(--font-ko);
  font-size: 13.5px;
  line-height: 1.7;
  min-height: 100vh;
}

.wrap {
  max-width: 740px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 44px 36px;
  display: grid;
  gap: 34px;
}

/* ───────── 창 공통 ───────── */
.window { position: relative; }

.tab {
  display: inline-flex;
  align-items: center;
  gap: 18px;
  padding: 6px 16px 4px 18px;
  border-radius: 14px 14px 0 0;
  background: var(--lilac);
  font-family: var(--font-en);
  font-size: 13px;
  font-weight: 700;
  font-style: italic;
  color: var(--berry);
}
.tab b {
  font-style: normal;
  font-size: 12px;
  color: var(--hot);
}
.window.chats-win .tab { background: var(--peach); }

.frame {
  background: var(--cream);
  border: 2px solid var(--white);
  border-radius: 0 20px 20px 20px;
  box-shadow: 0 0 0 5px var(--lilac), 0 16px 34px rgba(184, 70, 111, .18);
  overflow: hidden;
}
.window.chats-win .frame { box-shadow: 0 0 0 5px var(--peach), 0 16px 34px rgba(184, 70, 111, .18); }

/* 툴바 */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: linear-gradient(180deg, var(--white), var(--blush));
  border-bottom: 2px solid var(--white);
}
.toolbar .dots { display: flex; gap: 6px; }
.toolbar .dots i {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}
.toolbar .dots i:nth-child(1) { background: var(--hot); }
.toolbar .dots i:nth-child(2) { background: var(--peach); }
.toolbar .dots i:nth-child(3) { background: var(--lilac); }
.toolbar .arrows {
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 15px;
  color: var(--rose);
  letter-spacing: 6px;
}
.address {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 14px;
  border-radius: 999px;
  background: var(--white);
  box-shadow: inset 0 0 0 1.5px var(--blush);
  font-family: var(--font-en);
  font-size: 12px;
  color: var(--berry);
  white-space: nowrap;
  overflow: hidden;
}
.address svg { width: 16px; flex: 0 0 auto; fill: var(--rose); }

/* 창 안쪽 도트 */
.body {
  background-color: var(--cream);
  background-image: radial-gradient(var(--blush) 2px, transparent 2.5px);
  background-size: 22px 22px;
}

/* ───────── ① my page ───────── */
.page-body {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 26px;
  padding: 26px 26px 24px;
  align-items: start;
}

.left {
  display: grid;
  justify-items: center;
  gap: 14px;
}

.profile {
  display: grid;
  justify-items: center;
  gap: 10px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: inherit;
}
.avatar {
  position: relative;
  display: block;
  width: 156px;
  height: 156px;
  transition: transform .3s ease;
}
/* 프사 뒤 물결 테두리 */
.avatar::before {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: repeating-conic-gradient(var(--peach) 0 15deg, var(--lilac) 15deg 30deg);
  -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%);
          mask: radial-gradient(circle, transparent 62%, #000 63%);
}
.avatar .photo {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 5px solid var(--white);
  overflow: hidden;
  background: var(--blush);
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.avatar .bow {
  position: absolute;
  top: -20px;
  left: 50%;
  width: 50px;
  transform: translateX(-50%) rotate(-6deg);
  fill: var(--hot);
  filter: drop-shadow(0 2px 0 var(--white));
}
.avatar .sticker {
  position: absolute;
  right: -10px;
  bottom: 8px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--white);
  font-family: var(--font-en);
  font-size: 11px;
  font-weight: 700;
  color: var(--hot);
  box-shadow: 0 3px 8px rgba(244, 91, 143, .25);
  transform: rotate(8deg);
}
.profile:hover .avatar { transform: scale(1.03) rotate(-2deg); }
.profile:focus-visible { outline: none; }
.profile:focus-visible .photo { border-color: var(--hot); }

.tap {
  font-family: var(--font-en);
  font-size: 11px;
  font-weight: 700;
  color: var(--berry);
}

/* 링크 버튼 — 세로로 쌓기 */
.links {
  width: 100%;
  display: grid;
  gap: 7px;
}
.links a {
  display: block;
  text-align: center;
  padding: 5px 12px;
  border-radius: 10px;
  font-family: var(--font-en);
  font-size: 12px;
  font-weight: 700;
  color: var(--berry);
  text-decoration: none;
  background: linear-gradient(180deg, var(--white) 0%, var(--blush) 100%);
  box-shadow: inset 0 0 0 1.5px var(--white), 0 3px 0 var(--peach);
  transition: transform .2s, box-shadow .2s;
}
.links a:nth-child(2) { box-shadow: inset 0 0 0 1.5px var(--white), 0 3px 0 var(--lilac); }
.links a:nth-child(3) { box-shadow: inset 0 0 0 1.5px var(--white), 0 3px 0 var(--rose); }
.links a::after { content: " ♡"; color: var(--hot); }
.links a:hover { transform: translateY(-2px); }
.links a:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

/* 오른쪽 */
.right {
  min-width: 0;
  padding-top: 4px;
}
.logo {
  margin: 0;
  font-family: var(--font-en);
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--white);
  -webkit-text-stroke: 1.5px var(--hot);
  paint-order: stroke fill;
  text-shadow: 3px 3px 0 var(--peach);
}
.logo-sub {
  margin: 6px 0 0;
  display: inline-block;
  padding: 0 10px;
  border-radius: 6px;
  background: var(--lilac);
  font-family: var(--font-en);
  font-size: 11px;
  font-weight: 700;
  color: var(--berry);
}

.greet p {
  margin: 16px 0 0;
}
.greet .hl { color: var(--hot); }

.intro { animation: pop .45s ease; }
.intro h2 {
  margin: 0;
  display: inline-block;
  font-family: var(--font-en);
  font-size: 20px;
  font-weight: 700;
  color: var(--hot);
  background: linear-gradient(transparent 60%, var(--blush) 60%);
  padding-inline: 2px;
}
.intro dl {
  margin: 12px 0 0;
  display: grid;
  gap: 6px;
}
.intro dl div {
  display: grid;
  grid-template-columns: 66px 1fr;
  gap: 10px;
  align-items: center;
}
.intro dt {
  text-align: center;
  padding: 1px 0;
  border-radius: 6px;
  font-size: 12px;
  color: var(--white);
  background: var(--rose);
}
.intro dl div:nth-child(2) dt { background: var(--hot); }
.intro dl div:nth-child(3) dt { background: #ffa6c1; }
.intro dd { margin: 0; color: var(--berry); }
.intro .msg {
  margin: 14px 0 0;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--white);
  border: 1.5px dashed var(--peach);
  font-size: 12.5px;
  white-space: pre-line; /* 코드에서 엔터 친 그대로 줄바꿈 */
}

/* 하단 바 */
.foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  background: linear-gradient(90deg, var(--blush), #fbe3f3, #ffe6e1);
  border-top: 2px solid var(--white);
  font-family: var(--font-en);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--berry);
}
.foot .play {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 0;
  padding: 0;
  display: grid;
  place-items: center;
  background: var(--hot);
  cursor: pointer;
  box-shadow: 0 2px 0 var(--berry);
}
.foot .play svg { width: 11px; height: 11px; fill: var(--white); }
.foot .play:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }
.foot .song {
  min-width: 0;
  max-width: 45%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.foot .track {
  flex: 1;
  min-width: 40px;
  height: 4px;
  border-radius: 999px;
  background: var(--white);
  overflow: hidden;
  cursor: pointer;
}
.foot .track i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--hot);
  border-radius: 999px;
}
.foot .time { color: var(--rose); font-variant-numeric: tabular-nums; }

/* ───────── ② my chats ───────── */
.chats-body { padding: 22px 22px 24px; }

.chats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.card {
  display: flex;
  flex-direction: column;
  background: var(--white);
  border-radius: 16px;
  padding: 7px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 4px 0 var(--peach);
  transition: transform .25s ease;
}
.card:nth-child(3n+2) { box-shadow: 0 4px 0 var(--lilac); }
.card:nth-child(3n) { box-shadow: 0 4px 0 var(--rose); }
.card:hover { transform: translateY(-4px); }
.card:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

.card .pic {
  position: relative;
  aspect-ratio: 1 / 1;
  max-width: 100%;
  border-radius: 11px;
  overflow: hidden;
  background: var(--blush);
}
.card .pic img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.card .pic .noimg {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-size: 28px;
  color: var(--rose);
}
.card .num {
  position: absolute;
  top: 7px;
  left: 7px;
  padding: 0 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .92);
  font-family: var(--font-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--hot);
}

.card .meta {
  padding: 9px 4px 3px;
  display: grid;
  gap: 1px;
}
.card .name {
  margin: 0;
  font-size: 14.5px;
  font-weight: 400;
  color: var(--berry);
  line-height: 1.4;
}
.card .line {
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-line; /* \n 쓰면 줄바꿈 */
}
.card .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.card .tags span {
  font-size: 11px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--blush);
  color: var(--hot);
}
.card .tags span:nth-child(2) { background: #ffd9e5; color: var(--hot); }
.card .tags span:nth-child(3) { background: #ffeef4; color: var(--rose); }

.outside {
  margin: 0;
  text-align: center;
  font-family: var(--font-en);
  font-size: 12px;
  color: var(--berry);
}

@keyframes pop {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .intro { animation: none; }
  .card, .avatar, .links a { transition: none; }
}

/* ───────── 모바일 ───────── */
@media (max-width: 600px) {
  .wrap { gap: 28px; padding-block: 32px 30px; }
  .toolbar .arrows { display: none; }
  .page-body { grid-template-columns: 1fr; gap: 22px; padding: 26px 18px 20px; justify-items: center; }
  .left { display: contents; }          /* 폰: 프사 → 소개 → 링크 순서 */
  .profile { order: 1; }
  .right { order: 2; width: 100%; }
  .links { order: 3; max-width: 240px; }
  .right { text-align: center; }
  .intro { text-align: left; }
  .chats-body { padding: 16px 14px 20px; }
  .chats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}
</style>
</head>

/* 프사 클릭 → 인사 ↔ 자기소개 */
const btn = document.getElementById("profileBtn");
const greet = document.getElementById("greet");
const intro = document.getElementById("intro");
const hint = document.getElementById("hint");
btn.addEventListener("click", () => {
  const open = intro.hidden;
  intro.hidden = !open;
  greet.hidden = open;
  btn.setAttribute("aria-expanded", open);
  hint.textContent = open ? "✦ close ✦" : "✦ tap me ✦";
});

/* 링크 비어 있는 버튼은 눌러도 이동 안 함 */
document.querySelectorAll(".links a").forEach(a => {
  if (!a.getAttribute("href")) {
    a.addEventListener("click", e => e.preventDefault());
    a.style.cursor = "default";
  }
});

/* 음악 재생 */
const bgm = document.getElementById("bgm");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const bar = document.getElementById("bar");
const timeEl = document.getElementById("time");
const fmt = t => isFinite(t) ? Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0") : "0:00";
const PLAY = '<path d="M6 3l15 9-15 9z"/>';
const PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

playBtn.addEventListener("click", () => {
  if (bgm.paused) bgm.play().catch(() => {});
  else bgm.pause();
});
bgm.addEventListener("play", () => { playIcon.innerHTML = PAUSE; playBtn.setAttribute("aria-label", "일시정지"); });
bgm.addEventListener("pause", () => { playIcon.innerHTML = PLAY; playBtn.setAttribute("aria-label", "재생"); });
bgm.addEventListener("loadedmetadata", () => { timeEl.textContent = "0:00 / " + fmt(bgm.duration); });
bgm.addEventListener("timeupdate", () => {
  bar.style.width = (bgm.currentTime / bgm.duration * 100 || 0) + "%";
  timeEl.textContent = fmt(bgm.currentTime) + " / " + fmt(bgm.duration);
});
/* 바 누르면 그 위치로 이동 */
document.getElementById("track").addEventListener("click", e => {
  if (!isFinite(bgm.duration)) return;
  const r = e.currentTarget.getBoundingClientRect();
  bgm.currentTime = (e.clientX - r.left) / r.width * bgm.duration;
});

/* 카드 그리기 */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("chatList").innerHTML = CHATS.map((c, i) => `
  <a class="card" href="${esc(c.link)}" target="_blank" rel="noopener">
    <div class="pic">
      ${c.img
        ? `<img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy">`
        : `<div class="noimg">♡</div>`}
      <span class="num">no.${String(i + 1).padStart(2, "0")}</span>
    </div>
    <div class="meta">
      <h3 class="name">${esc(c.name)}</h3>
      <p class="line">${esc(c.line)}</p>
      <div class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
    </div>
  </a>`).join("");
</script>
