<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제초의 방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Comfortaa:wght@500;700&display=swap">
<style>
/* 레이아웃: 하늘색 사선 배경 위 캐럿(Carrd)풍 액자 페이지
   — 캔디 스트라이프 배너 + 프사 → 클릭 시 옆에 About me → 메뉴 버튼 → 차양 → 캐챗 카드 → 리본 구분선 → 하단 바 */
:root {
  color-scheme: light;
  --sky: #cfe9f7;        /* 바깥 하늘색 */
  --sky-deep: #9fd0ec;   /* 하늘색 포인트 */
  --pink: #f7b9cb;       /* 메인 핑크 */
  --pink-deep: #ec8fab;  /* 진한 핑크 */
  --pink-soft: #fde8ef;  /* 연핑크 면 */
  --white: #ffffff;
  --ink: #8a6a76;        /* 본문 글자 */

  --font-ko: "Gowun Dodum", "Noto Sans CJK KR", "Apple SD Gothic Neo", sans-serif;
  --font-en: "Comfortaa", "Gowun Dodum", "Noto Sans CJK KR", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: #eef7fc;
  background-image: repeating-linear-gradient(
    135deg, transparent 0 22px, rgba(159, 208, 236, .28) 22px 34px
  );
  color: var(--ink);
  font-family: var(--font-ko);
  font-size: 13.5px;
  line-height: 1.7;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 40px 40px;
}

/* ───────── 바깥 액자 ───────── */
.page {
  background: var(--white);
  border: 10px solid var(--sky);
  border-radius: 26px;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(159, 208, 236, .35);
}

/* 위아래 레이스 띠 */
.lace {
  height: 30px;
  border-radius: 10px;
  background:
    radial-gradient(circle at 8px 100%, var(--white) 5px, transparent 5.5px) 0 0 / 16px 8px repeat-x,
    var(--pink);
  position: relative;
}
.lace::after {
  content: "";
  position: absolute;
  left: 10px;
  right: 10px;
  top: 10px;
  border-top: 2px dashed var(--white);
}
.lace.bottom {
  background:
    radial-gradient(circle at 8px 0, var(--white) 5px, transparent 5.5px) 0 100% / 16px 8px repeat-x,
    var(--pink);
}

.inner {
  margin-block: 10px;
  border: 3px solid var(--pink-soft);
  border-radius: 14px;
  overflow: hidden;
}

/* ───────── 배너 + 프사 + 소개 ───────── */
.banner {
  position: relative;
  height: 110px;
  background: repeating-linear-gradient(
    90deg, var(--pink-soft) 0 18px, var(--white) 18px 36px
  );
  border-bottom: 3px solid var(--pink-soft);
}
.banner .spark {
  position: absolute;
  fill: var(--sky-deep);
}
.banner .s1 { width: 22px; top: 22px; left: 46%; }
.banner .s2 { width: 14px; top: 58px; left: 62%; fill: var(--pink-deep); }
.banner .s3 { width: 18px; top: 18px; right: 12%; }
.banner .bow {
  position: absolute;
  right: 22px;
  bottom: 14px;
  width: 54px;
  fill: var(--pink);
}

.top {
  display: flex;
  gap: 22px;
  padding: 0 22px 20px;
}

.profile {
  flex: 0 0 auto;
  margin-top: -78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: inherit;
  position: relative;
  z-index: 1;
}
.avatar {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 5px solid var(--white);
  box-shadow: 0 0 0 3px var(--pink), 0 8px 18px rgba(236, 143, 171, .25);
  overflow: hidden;
  background: var(--pink-soft);
  transition: transform .3s ease;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.profile:hover .avatar { transform: rotate(-3deg) scale(1.03); }
.profile:focus-visible { outline: none; }
.profile:focus-visible .avatar { box-shadow: 0 0 0 4px var(--pink-deep); }

.tap {
  font-family: var(--font-en);
  font-size: 11px;
  font-weight: 700;
  color: var(--sky-deep);
  border: 2px dashed var(--sky);
  border-radius: 999px;
  padding: 1px 12px;
  background: var(--white);
}

.side {
  flex: 1;
  min-width: 0;
  padding-top: 14px;
}

.title-en {
  margin: 0;
  font-family: var(--font-en);
  font-size: 19px;
  font-weight: 700;
  color: var(--sky-deep);
  line-height: 1.4;
}
.title-en small {
  font-size: 13px;
  color: var(--pink-deep);
}

.greet .name {
  margin: 2px 0 0;
  font-size: 26px;
  color: var(--pink-deep);
  line-height: 1.3;
}
.greet p {
  margin: 4px 0 0;
  font-size: 13px;
}

.intro { animation: pop .45s ease; }
.intro dl {
  margin: 8px 0 0;
  display: grid;
}
.intro dl div {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 8px;
  padding-block: 4px;
  border-bottom: 1px dashed var(--pink);
}
.intro dt {
  font-size: 12px;
  color: var(--pink-deep);
}
.intro dt::before { content: "✦ "; color: var(--sky-deep); }
.intro dd { margin: 0; }
.intro .msg {
  margin: 10px 0 0;
  padding: 6px 12px;
  border-radius: 10px;
  background: var(--pink-soft);
  font-size: 12.5px;
  color: var(--pink-deep);
  white-space: pre-line; /* 코드에서 엔터 친 그대로 줄바꿈 */
}

/* ───────── 메뉴 버튼 ───────── */
.nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  background: repeating-linear-gradient(
    90deg, var(--white) 0 18px, #fdf3f6 18px 36px
  );
  border-block: 3px solid var(--pink-soft);
}
.nav a {
  flex: 0 0 auto;
  min-width: 84px;
  text-align: center;
  font-family: var(--font-en);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.6;
  color: var(--pink-deep);
  text-decoration: none;
  padding: 2px 12px;
  border: 1.5px dashed var(--sky-deep);
  border-radius: 999px;
  background: var(--white);
  transition: background .2s;
}
.nav a:hover { background: var(--pink-soft); }
.nav a:focus-visible { outline: 2px solid var(--pink-deep); outline-offset: 2px; }

/* 차양 */
.awning {
  height: 26px;
  background:
    radial-gradient(circle at 18px 0, var(--pink) 17px, transparent 17.5px) 0 0 / 72px 26px repeat-x,
    radial-gradient(circle at 54px 0, var(--pink-soft) 17px, transparent 17.5px) 0 0 / 72px 26px repeat-x;
}

/* ───────── 캐챗 ───────── */
.chats-wrap {
  padding: 14px 22px 22px;
  background-color: var(--white);
  background-image: radial-gradient(var(--pink-soft) 1.6px, transparent 2px);
  background-size: 18px 18px;
}

.sec-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 14px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--pink-soft);
}
.sec-title .title-en { font-size: 16px; }
.sec-title span {
  font-size: 13px;
  color: var(--pink-deep);
}

.chats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.card {
  display: flex;
  flex-direction: column;
  background: var(--white);
  border: 2px solid var(--pink);
  border-radius: 12px;
  padding: 6px;
  text-decoration: none;
  color: inherit;
  transition: transform .25s ease;
}
.card:hover { transform: translateY(-4px) rotate(-1deg); }
.card:focus-visible { outline: 3px solid var(--sky-deep); outline-offset: 2px; }

.card .pic {
  aspect-ratio: 1 / 1;
  max-width: 100%;
  border: 2px solid var(--sky);
  border-radius: 8px;
  overflow: hidden;
  background: var(--pink-soft);
}
.card .pic img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.card .pic .noimg {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-size: 28px;
  color: var(--pink);
}

.card .meta {
  padding: 8px 4px 2px;
  display: grid;
  gap: 1px;
}
.card .name {
  margin: 0;
  font-size: 14.5px;
  font-weight: 400;
  color: var(--pink-deep);
  line-height: 1.4;
}
.card .line {
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-line; /* \n 쓰면 줄바꿈 */
}
.card .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
}
.card .tags span {
  font-size: 11px;
  padding: 0 8px;
  border-radius: 999px;
  background: #eaf5fc;
  color: var(--sky-deep);
}

/* 리본 구분선 */
.ribbon-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px 6px;
}
.ribbon-line i {
  width: 22px;
  height: 7px;
  border-radius: 999px;
  background: var(--pink);
}
.ribbon-line svg { width: 34px; fill: var(--pink-deep); }

/* 하단 바 */
.bar {
  margin: 10px 22px 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  border: 2px solid #eaf5fc;
  border-radius: 8px;
  padding: 6px 12px;
  font-family: var(--font-en);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--pink);
}
.bar b { color: var(--pink-deep); }
.bar .gap { flex: 1; }
.bar .made { color: var(--sky-deep); }

.outside {
  margin-top: 18px;
  text-align: center;
  font-family: var(--font-en);
  font-size: 12px;
  color: var(--sky-deep);
}

@keyframes pop {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .intro { animation: none; }
  .card, .avatar { transition: none; }
}

/* ───────── 모바일 ───────── */
@media (max-width: 600px) {
  .page { border-width: 7px; padding: 7px; }
  .top { flex-direction: column; align-items: center; gap: 10px; padding: 0 16px 18px; }
  .side { width: 100%; padding-top: 0; }
  .greet { text-align: center; }
  .avatar { width: 128px; height: 128px; }
  .profile { margin-top: -66px; }
  .nav { gap: 8px; }
  .chats-wrap { padding: 12px 14px 18px; }
  .chats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bar { margin-inline: 14px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="page">
    <div class="lace"></div>

    <div class="inner">

      <!-- ① 배너 -->
      <div class="banner" aria-hidden="true">
        <svg class="spark s1" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
        <svg class="spark s2" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
        <svg class="spark s3" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
        <svg class="bow" viewBox="0 0 60 36"><path d="M30 16C22 2 4 2 6 14 8 26 22 24 30 16ZM30 16C38 2 56 2 54 14 52 26 38 24 30 16ZM27 18 20 35 26 32 29 35ZM33 18 40 35 34 32 31 35Z"/><circle cx="30" cy="16" r="5"/></svg>
      </div>

      <!-- ② 프사 + 소개 -->
      <section class="top" id="home">
        <button class="profile" id="profileBtn" type="button" aria-expanded="false" aria-controls="intro">
          <span class="avatar">
            <!-- 프사 -->
            <img id="profileImg" src="000.jpg" alt="제초 프로필 사진">
          </span>
          <span class="tap" id="hint">tap me ♡</span>
        </button>

        <div class="side">
          <!-- 처음 보이는 인사 -->
          <div class="greet" id="greet">
            <p class="title-en">hello !! <small>✦</small></p>
            <p class="name">제초</p>
            <p>프사를 누르면 자기소개가 나와요</p>
          </div>

          <!-- 프사 누르면 나오는 자기소개 -->
          <article class="intro" id="intro" hidden>
            <p class="title-en">About me !! <small>✦</small></p>
            <dl>
              <div><dt>닉네임</dt><dd>제초</dd></div>
              <div><dt>서식지</dt><dd>ZEPETO</dd></div>
              <div><dt>키워드</dt><dd>#순애 #로코 #개그</dd></div>
            </dl>
            <p class="msg">제가 올리는 모든 채팅은 제페토에서만 만나보실 수 있습니다.</p>
          </article>
        </div>
      </section>

      <!-- ③ 메뉴 -->
      <!-- 링크는 href="" 안에 넣으면 돼요 (비워두면 눌러도 아무 일 없음) -->
      <nav class="nav">
        <a href="https://x.com/zech0o" target="_blank" rel="noopener">Twitter</a>
        <a href="" target="_blank" rel="noopener">오픈채팅</a>
        <a href="" target="_blank" rel="noopener">Discord</a>
      </nav>

      <div class="awning" aria-hidden="true"></div>

      <!-- ④ 제작 캐챗 -->
      <section class="chats-wrap" id="chats">
        <div class="sec-title">
          <p class="title-en">my chats</p>
          <span>제작 캐챗</span>
        </div>
        <div class="chats" id="chatList"></div>

        <div class="ribbon-line" aria-hidden="true">
          <i></i><i></i><i></i>
          <svg viewBox="0 0 60 36"><path d="M30 16C22 2 4 2 6 14 8 26 22 24 30 16ZM30 16C38 2 56 2 54 14 52 26 38 24 30 16ZM27 18 20 35 26 32 29 35ZM33 18 40 35 34 32 31 35Z"/><circle cx="30" cy="16" r="5"/></svg>
          <i></i><i></i><i></i>
        </div>
      </section>

      <!-- ⑤ 하단 바 -->
      <div class="bar">
        <span>♪ <b>playing :</b> zepeto chat</span>
        <span class="gap"></span>
        <span class="made">made by 제초</span>
      </div>

    </div>

    <div class="lace bottom"></div>
  </div>

  <p class="outside">( zecho.win )</p>
</div>

<script>
/* 캐챗 목록 — 여기만 고치면 카드가 바뀌어요
   img: 이미지 파일 이름 / link: 채팅 링크 */
const CHATS = [
  {
    name: "수인고등학교",
    line: "수인고등학교에서 살아남자!",
    tags: ["수인", "학원물"],
    img: "001.jpg",
    link: "https://web.zepeto.me/share/contents/preview/chatbot/6ac4ebf95cd76264c7ca33ac"
  },
  {
    name: "ROCK 밴드하자!",
    line: "한 줄 소개를 적어주세요",
    tags: ["밴드", "학원물", "청춘"],
    img: "002.jpg",
    link: "https://web.zepeto.me/share/contents/preview/chatbot/6ac76a46d7f71127590d6b13"
  },
  {
    name: "인소가 뭐야?",
    line: "𝙱𝙰𝙲𝙺 𝚃𝙾 𝚃𝙷𝙴 𝟸𝟶𝟶𝟼。。。",
    tags: ["인소", "학원물"],
    img: "003.gif",
    link: "https://web.zepeto.me/share/contents/preview/chatbot/6ac98528b36f5737f711a01c"
  }
];

/* 프사 클릭 → 인사 ↔ 자기소개 */
const btn = document.getElementById("profileBtn");
const greet = document.getElementById("greet");
const intro = document.getElementById("intro");
const hint = document.getElementById("hint");
btn.addEventListener("click", () => {
  const open = intro.hidden;
  intro.hidden = !open;
  greet.hidden = open;
  btn.setAttribute("aria-expanded", open);
  hint.textContent = open ? "close ♡" : "tap me ♡";
});

/* 링크 비어 있는 버튼은 눌러도 이동 안 함 */
document.querySelectorAll(".nav a").forEach(a => {
  if (!a.getAttribute("href")) {
    a.addEventListener("click", e => e.preventDefault());
    a.style.cursor = "default";
  }
});

/* 카드 그리기 */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("chatList").innerHTML = CHATS.map(c => `
  <a class="card" href="${esc(c.link)}" target="_blank" rel="noopener">
    <div class="pic">
      ${c.img
        ? `<img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy">`
        : `<div class="noimg">♡</div>`}
    </div>
    <div class="meta">
      <h3 class="name">${esc(c.name)}</h3>
      <p class="line">${esc(c.line)}</p>
      <div class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
    </div>
  </a>`).join("");
</script>
</body>
</html>
