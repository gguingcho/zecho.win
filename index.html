<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제초의 방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@500&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap">
<style>
/* 레이아웃: 흐릿한 발레핑크 배경 위 유리(반투명) 카드 — 얇은 선 리본 프사 → 클릭 시 옆으로 유리 카드 소개 → 아래 캐챗 */
:root {
  color-scheme: light;
  --bg: #fbeef1;
  --blob-1: #f9c9d6;
  --blob-2: #fde2d4;
  --blob-3: #f3d4ec;
  --glass: rgba(255, 255, 255, .55);
  --glass-line: rgba(255, 255, 255, .8);
  --pink: #e8a3b5;
  --pink-deep: #c9758d;
  --ink: #4b3d42;
  --muted: #9c8890;

  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --font-name: "Noto Serif KR", "Noto Serif CJK KR", serif;
  --font-en: "Cormorant Garamond", "Noto Serif CJK KR", serif;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 14px;
  line-height: 1.75;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 흐릿한 배경 덩어리 */
.blobs {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  filter: blur(70px);
}
.blobs span {
  position: absolute;
  border-radius: 50%;
}
.blobs span:nth-child(1) { width: 46vw; height: 46vw; background: var(--blob-1); top: -10vw; left: -8vw; }
.blobs span:nth-child(2) { width: 40vw; height: 40vw; background: var(--blob-2); top: 20vh; right: -10vw; }
.blobs span:nth-child(3) { width: 38vw; height: 38vw; background: var(--blob-3); bottom: -12vw; left: 30vw; }

.wrap {
  position: relative;
  z-index: 1;
  max-width: 940px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 72px 64px;
}

/* 유리 카드 공통 */
.glass {
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 24px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 40px rgba(201, 117, 141, .12);
}

/* ───────── 상단 ───────── */
.hero {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  min-height: 320px;
  transition: gap .5s ease;
}
.hero.open { gap: 48px; }

.profile {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: inherit;
}

.avatar {
  position: relative;
  width: 180px;
  height: 180px;
}
.avatar .ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid var(--pink);
  opacity: .6;
}
.avatar img,
.avatar .noimg {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  object-position: center;
  display: block;
  box-shadow: 0 12px 34px rgba(201, 117, 141, .3);
  transition: transform .4s ease;
}
.avatar .noimg {
  display: grid;
  place-items: center;
  background: linear-gradient(160deg, #fff, var(--blob-1));
  font-family: var(--font-name);
  font-size: 18px;
  color: var(--pink-deep);
}
.profile:hover .avatar img,
.profile:hover .avatar .noimg { transform: scale(1.03); }
.profile:focus-visible { outline: none; }
.profile:focus-visible .ring { border: 2px solid var(--pink-deep); opacity: 1; }

/* 얇은 선 리본 */
.bow {
  position: absolute;
  top: -22px;
  left: 50%;
  width: 58px;
  transform: translateX(-50%);
  fill: none;
  stroke: var(--pink-deep);
  stroke-width: 1.3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.who {
  text-align: center;
  display: grid;
  gap: 2px;
}
.who strong {
  font-family: var(--font-name);
  font-weight: 500;
  font-size: 20px;
  letter-spacing: .02em;
}
.who em {
  font-family: var(--font-en);
  font-size: 15px;
  color: var(--pink-deep);
}

/* 자기소개 */
.intro {
  flex: 0 1 380px;
  min-width: 0;
  padding: 28px 28px 24px;
  animation: fade .55s ease;
}
.intro .en {
  margin: 0 0 12px;
  font-family: var(--font-en);
  font-style: italic;
  font-size: 17px;
  color: var(--pink-deep);
}
.intro dl {
  margin: 0;
  display: grid;
}
.intro dl div {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 10px;
  padding-block: 9px;
  border-bottom: 1px solid rgba(232, 163, 181, .35);
}
.intro dl div:last-child { border-bottom: 0; }
.intro dt { font-size: 12.5px; color: var(--muted); }
.intro dd { margin: 0; font-weight: 400; }
.intro .msg {
  margin: 16px 0 0;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .6);
  font-size: 13.5px;
}

/* ───────── 캐챗 ───────── */
.section-head {
  margin-block: 80px 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
}
.section-head .title { display: grid; gap: 0; }
.section-head .title em {
  font-family: var(--font-en);
  font-size: 16px;
  color: var(--pink-deep);
}
.section-head h2 {
  margin: 0;
  font-family: var(--font-name);
  font-weight: 500;
  font-size: 22px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
}
.filters button {
  font: inherit;
  font-size: 12.5px;
  padding: 5px 14px;
  border-radius: 999px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.filters button.on { background: #fff; color: var(--pink-deep); box-shadow: 0 2px 8px rgba(201,117,141,.15); }
.filters button:focus-visible { outline: 2px solid var(--pink-deep); outline-offset: 1px; }

.chats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 18px;
}

.card {
  display: flex;
  flex-direction: column;
  padding: 8px;
  text-decoration: none;
  color: inherit;
  transition: transform .3s ease, box-shadow .3s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(201, 117, 141, .2); }
.card:focus-visible { outline: 2px solid var(--pink-deep); outline-offset: 3px; }

.card .pic {
  aspect-ratio: 4 / 5;
  max-width: 100%;
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(160deg, #fff, var(--blob-1));
}
.card .pic img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
.card .pic .noimg {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-family: var(--font-name);
  font-size: 30px;
  color: #fff;
}

.card .meta {
  padding: 12px 8px 6px;
  display: grid;
  gap: 2px;
}
.card .platform {
  font-family: var(--font-en);
  font-style: italic;
  font-size: 14px;
  color: var(--pink-deep);
}
.card .name {
  margin: 0;
  font-family: var(--font-name);
  font-weight: 500;
  font-size: 16px;
  line-height: 1.4;
}
.card .line {
  margin: 2px 0 0;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--muted);
}
.card .tags {
  margin: 6px 0 0;
  font-size: 11.5px;
  color: var(--pink-deep);
}

footer {
  margin-top: 72px;
  text-align: center;
  font-family: var(--font-en);
  font-style: italic;
  font-size: 15px;
  color: var(--pink-deep);
}

@keyframes fade {
  from { opacity: 0; transform: translateX(-14px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .intro { animation: none; }
  .hero, .card, .avatar img { transition: none; }
}

/* ───────── 모바일 ───────── */
@media (max-width: 680px) {
  .wrap { padding-block: 56px 56px; }
  .hero, .hero.open { flex-direction: column; gap: 28px; min-height: 0; }
  .intro { flex-basis: auto; width: 100%; }
  .avatar { width: 150px; height: 150px; }
  .chats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .section-head { margin-block: 56px 18px; }
}
</style>

</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="wrap">

  <!-- ① 프사 + 자기소개 -->
  <section class="hero" id="hero">
    <button class="profile" id="profileBtn" type="button" aria-expanded="false" aria-controls="intro">
      <span class="avatar">
        <span class="ring"></span>
        <!-- "000.jpg" -->
        <img id="000.jpg" src="" alt="제초 프로필 사진">
        <svg class="bow" viewBox="0 0 60 34" aria-hidden="true">
          <path d="M30 14 C22 2 8 2 8 11 C8 19 22 18 30 14Z"/>
          <path d="M30 14 C38 2 52 2 52 11 C52 19 38 18 30 14Z"/>
          <path d="M28 15 L20 32 M32 15 L40 32"/>
          <ellipse cx="30" cy="14" rx="3" ry="3.4"/>
        </svg>
      </span>
      <span class="who">
        <strong>제초</strong>
        <em id="hint">tap to say hello</em>
      </span>
    </button>

    <!-- 자기소개 내용 -->
    <article class="intro glass" id="intro" hidden>
      <p class="en">about me</p>
      <dl>
        <div><dt>장르</dt><dd>순애, 로코, 개그</dd></div>
        <div><dt>좋아하는</dt><dd>여기에 적어주세요</dd></div>
        <div><dt>문의</dt><dd>여기에 적어주세요</dd></div>
      </dl>
      <p class="msg">제가 올리는 모든 채팅은 제페토에서만 만나보실 수 있습니다.</p>
    </article>
  </section>

  <!-- ② 제작 캐챗 -->
  <div class="section-head">
    <div class="title">
      <em>my characters</em>
      <h2>제작 캐챗</h2>
    </div>
  </div>
  <section class="chats" id="chats"></section>

  <footer>made by jecho</footer>
</div>

<script>
/* 캐챗 목록 — 여기만 고치면 카드가 바뀌어요
   img: 이미지 주소 / link: 채팅 링크 */
const CHATS = [
  {
    name: "수인고등학교",
    line: "수인고등학교에서 살아남자!",
    tags: ["수인", "학원물"],
    img: "001.jpg",
    link: "https://web.zepeto.me/share/contents/preview/chatbot/6ac4ebf95cd76264c7ca33ac"
  },
  {
    name: "ROCK 밴드하자!",
    line: "한 줄 소개를 적어주세요",
    tags: ["밴드", "학원물", "청춘"],
    img: "002.jpg",
    link: "https://web.zepeto.me/share/contents/preview/chatbot/6ac76a46d7f71127590d6b13"
  },
  {
    name: "인소가 뭐야?",
    line: "𝙱𝙰𝙲𝙺 𝚃𝙾 𝚃𝙷𝙴 𝟸𝟶𝟶𝟼。。。",
    tags: ["인소", "학원물"],
    img: "003.gif",
    link: "https://web.zepeto.me/share/contents/preview/chatbot/6ac98528b36f5737f711a01c"
  },
  {
    name: "캐릭터 이름 4",
    line: "한 줄 소개를 적어주세요",
    tags: ["로맨스"],
    img: "",
    link: "#"
  }
];

/* 프사 자리표시 */
const pImg = document.getElementById("profileImg");
if (!pImg.getAttribute("src")) {
  const ph = document.createElement("span");
  ph.className = "noimg";
  ph.textContent = "제초";
  pImg.replaceWith(ph);
}

/* 프사 클릭 → 자기소개 열고 닫기 */
const btn = document.getElementById("profileBtn");
const intro = document.getElementById("intro");
const hero = document.getElementById("hero");
const hint = document.getElementById("hint");
btn.addEventListener("click", () => {
  const open = intro.hidden;
  intro.hidden = !open;
  hero.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open);
  hint.textContent = open ? "tap to close" : "tap to say hello";
});

/* 카드 + 필터 */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = document.getElementById("chats");

function render() {
  list.innerHTML = CHATS.map(c => `
    <a class="card glass" href="${esc(c.link)}" target="_blank" rel="noopener">
      <div class="pic">
        ${c.img
          ? `<img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy">`
          : `<div class="noimg">${esc(c.name.charAt(0))}</div>`}
      </div>
      <div class="meta">
        <h3 class="name">${esc(c.name)}</h3>
        <p class="line">${esc(c.line)}</p>
        <p class="tags">${c.tags.map(t => "#" + esc(t)).join(" ")}</p>
      </div>
    </a>`).join("");
}

render();
</script>
</body>
</html>
